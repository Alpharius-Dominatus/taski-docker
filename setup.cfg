[flake8]
# Игнорируем мелкие ошибки, которые нас не волнуют
ignore = 
    W503
    F811

# Полный список папок и файлов, которые не проверять
exclude = 
    backend/**/tests/
    backend/**/migrations/
    venv/
    */venv/
    .venv/
    */.venv/
    env/
    */env/
    __pycache__/
    .git/

# Игнорируем конкретные правила в отдельных файлах
per-file-ignores =
    backend/**/settings.py:E501
    backend/**/tests/*.py: I003,E302,W292